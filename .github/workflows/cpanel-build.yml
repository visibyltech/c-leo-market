name: Build cPanel package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpanel-build.yml'
      - 'src/views/AdminView.tsx'
      - 'src/views/AccountView.tsx'
      - 'src/lib/firebase.ts'
      - 'src/services/cloudinary.ts'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build production website
        run: npm run build
        env:
          VITE_ADMIN_EMAIL: tvplugng@gmail.com
          VITE_NEOCASH_PUBLIC_KEY: pk_test_c_leo_market_f3dbdefa071af348
      - name: Add cPanel SPA rewrite
        run: |
          cat > dist/.htaccess <<'EOF'
          Options -MultiViews
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: c-leo-market-cpanel-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

# Rebuild trigger: update NeoCash public test key.
