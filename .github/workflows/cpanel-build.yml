name: Build cPanel package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpanel-build.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Add cPanel SPA rewrite
        run: |
          cat > dist/.htaccess <<'EOF'
          Options -MultiViews
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: c-leo-market-cpanel-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
